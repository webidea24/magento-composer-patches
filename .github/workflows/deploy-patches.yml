name: Deploy patch artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'magento-patches/**/*.patch'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install build dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Build patch artifacts
        run: composer run build-patches

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload patch artifacts
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_PATH: ${{ secrets.DEPLOY_SSH_PATH }}
        run: |
          ssh_port="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$ssh_port" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "mkdir -p '$SSH_PATH'"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -p $ssh_port -o StrictHostKeyChecking=yes" .build/patches/ "$SSH_USER@$SSH_HOST:$SSH_PATH/"
